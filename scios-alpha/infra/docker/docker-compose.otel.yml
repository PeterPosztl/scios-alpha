# Optional OTel collector for B4 (run only after B1 Docker READY — human decision)
# Usage:
#   docker compose -f infra/docker/docker-compose.otel.yml up -d
#
# Pair with packaged.beta.overlay.json:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317
#   OTEL_SERVICE_NAME=scios-beta

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped
