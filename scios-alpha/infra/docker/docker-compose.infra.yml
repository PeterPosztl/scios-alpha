# Canonical local-foundation infra (Postgres + Redis only).
# Does not replace docker-compose.yml (app images).
# Start: docker-compose -f infra/docker/docker-compose.infra.yml up -d
#        pnpm docker:local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scios
      POSTGRES_PASSWORD: scios_local
      POSTGRES_DB: scios
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scios"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
